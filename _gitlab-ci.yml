stages:
  - build
  - test
  - deploy


build:
  stage: build
  image: node:18.12-alpine
  script:
    - npm install
    - npm run build
  only:
    - main

test:
  stage: test
  image: node:18.12-alpine  
  script:
    - npm install  
    - npm run test 
  only:
    - main 

deploy:
  stage: deploy
  image: docker:19.03.12 
  services:
    - docker:19.03.12-dind  
  script:
    - docker build -t alibaba.gitlab.com/site_ui:$CI_COMMIT_SHORT_SHA .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push alibaba.gitlab.com/site_ui:$CI_COMMIT_SHORT_SHA
  only:
    - main
